name: tfg

services:
  mongo:
    image: mongo:8.2.12
    container_name: tfg-mongo
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tfg-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini:ro
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      - ./backend/.coveragerc:/app/.coveragerc:ro
      - ./backend/coverage:/app/coverage
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/db', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tfg-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
    name: ${MONGO_VOLUME_NAME:-backend_mongo_data}
