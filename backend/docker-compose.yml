services:
  backend:
    build: .
    container_name: tfg-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./.coveragerc:/app/.coveragerc:ro
      - ./coverage:/app/coverage
      - ./uploads:/app/uploads
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: tfg-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
