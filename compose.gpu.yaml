# Optional override: leave compose.yaml CPU-compatible for every installation.
# Apply with: docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
services:
  backend:
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
