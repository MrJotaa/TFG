services:
  sonarqube:
    image: sonarqube:26.8.0.126808-community
    container_name: tfg-sonarqube
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}

    ports:
      - "9000:9000"

    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192

    networks:
      - sonarqube-network

  db:
    image: postgres:17.11
    container_name: tfg-sonarqube-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}

    volumes:
      - postgresql_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U sonar -d sonar
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - sonarqube-network

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:

networks:
  sonarqube-network:
    driver: bridge
